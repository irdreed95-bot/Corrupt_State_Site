<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080b10"><title>إدارة Corrupt State</title><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet"><style>
:root{--bg:#080b10;--panel:#111a25;--gold:#d6ad62;--text:#f4f1e9;--muted:#aab3bf;--line:#ffffff20}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Cairo,sans-serif}header{padding:18px 5%;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}a{color:var(--gold);text-decoration:none}.wrap{max-width:1100px;margin:35px auto;padding:0 18px}.panel{background:var(--panel);border:1px solid var(--line);padding:24px;margin:18px 0;border-radius:8px}h1,h2{margin-top:0}h1{font-size:27px}h2{font-size:20px;color:var(--gold)}label{display:block;font-size:13px;margin:10px 0 5px;color:#d7dce3}input,textarea,select{width:100%;padding:12px;background:#080e16;color:white;border:1px solid var(--line);border-radius:5px;font:inherit}textarea{min-height:90px}button{background:var(--gold);color:#17130b;border:0;border-radius:5px;padding:11px 18px;font:700 14px Cairo;cursor:pointer;margin-top:14px}.secondary{background:transparent;color:var(--gold);border:1px solid #d6ad6270}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.hidden{display:none}.item{border:1px solid var(--line);padding:14px;margin:10px 0;border-radius:5px}.item small{color:var(--muted)}.status{color:var(--gold);margin-top:10px;white-space:pre-wrap}.tabs{display:flex;gap:10px;flex-wrap:wrap}.ticket{border-bottom:1px solid var(--line);padding:14px 0}.ticket p{margin:5px 0;color:#cbd2da;white-space:pre-wrap}.danger{background:#8e3434;color:white}@media(max-width:650px){.grid{grid-template-columns:1fr}.panel{padding:17px}}
</style></head><body><header><strong>CS / لوحة إدارة الموقع</strong><a href="./index.html">العودة للموقع ←</a></header><main class="wrap"><section id="login" class="panel"><h1>دخول الإدارة</h1><p>لوحة تحكم خاصة بإدارة Corrupt State RP.</p><label>كلمة مرور الإدارة</label><input id="password" type="password" autocomplete="current-password" placeholder="كلمة المرور"><button id="loginBtn">تسجيل الدخول</button><div class="status" id="loginMsg"></div></section>
<div id="dashboard" class="hidden"><section class="panel"><h1>لوحة التحكم</h1><div class="tabs"><button class="secondary" id="refresh">تحديث البيانات</button><button class="danger" id="logout">تسجيل الخروج</button></div><div class="status" id="msg"></div></section>
<section class="panel"><h2>إضافة إعلان / خبر / توظيف / مشهد</h2><form id="contentForm"><div class="grid"><div><label>نوع المحتوى</label><select id="kind"><option value="news">خبر</option><option value="announcement">إعلان</option><option value="hiring">توظيف مطورين</option><option value="hero">مشهد سينمائي رئيسي</option><option value="gallery">صورة معرض</option></select></div><div><label>العنوان</label><input id="title" required maxlength="100"></div></div><label>الوصف</label><textarea id="description" maxlength="700"></textarea><div class="grid"><div><label>رابط الصورة (HTTPS)</label><input id="image" type="url" placeholder="https://..."></div><div><label>رابط فيديو MP4 للمشهد السينمائي (HTTPS)</label><input id="video" type="url" placeholder="https://..."></div></div><div class="grid"><div><label>نص الرابط الاختياري</label><input id="cta" placeholder="قدّم الآن"></div><div><label>رابط التقديم / التفاصيل</label><input id="href" type="url" placeholder="https://..."></div></div><div class="grid"><div><label>ترتيب العرض</label><input id="sort" type="number" value="0"></div><div><label>النشر</label><select id="published"><option value="true">منشور</option><option value="false">مسودة</option></select></div></div><button>نشر المحتوى</button></form></section>
<section class="panel"><h2>إعداد مشهد الواجهة السينمائي</h2><label>رابط فيديو MP4 مباشر (HTTPS)</label><input id="heroVideo" type="url" placeholder="https://...mp4"><button id="saveVideo">حفظ المشهد</button></section>
<section class="panel"><h2>المحتوى المنشور</h2><div id="contentList">جارٍ التحميل…</div></section><section class="panel"><h2>طلبات الدعم الفني</h2><div id="tickets">جارٍ التحميل…</div></section></div></main>
<script>
const API="https://corrupt-state-site-api.irdreed95.workers.dev",$=id=>document.getElementById(id);let token=sessionStorage.getItem("cs_admin_token")||"";
async function call(path,options={}){const r=await fetch(API+path,{...options,headers:{"Content-Type":"application/json",...(token?{Authorization:"Bearer "+token}:{}),...(options.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||"تعذر تنفيذ الطلب");return d}
$("loginBtn").onclick=async()=>{try{const d=await call("/api/admin/login",{method:"POST",body:JSON.stringify({password:$("password").value})});token=d.token;sessionStorage.setItem("cs_admin_token",token);show();}catch(e){$("loginMsg").textContent=e.message}};
function show(){$("login").classList.add("hidden");$("dashboard").classList.remove("hidden");load()}
async function load(){try{const [c,t,s]=await Promise.all([call("/api/admin/content"),call("/api/admin/tickets"),call("/api/public/site")]);$("contentList").innerHTML=c.content.map(x=>'<div class="item"><b>'+esc(x.title)+'</b> <small>('+esc(x.kind)+')</small><br><small>'+esc(x.id)+'</small><br><button class="danger" onclick="removeContent(\''+esc(x.id)+'\')">حذف</button></div>').join("")||"لا يوجد محتوى";$("tickets").innerHTML=t.tickets.map(x=>'<div class="ticket"><b>'+esc(x.id)+' — '+esc(x.player)+'</b> <small>'+esc(x.created_at)+' • '+esc(x.status)+'</small><p>'+esc(x.email)+' | '+esc(x.category)+' | '+esc(x.platform)+'</p><p>'+esc(x.details)+'</p><select id="st-'+esc(x.id)+'"><option value="new">جديد</option><option value="in_progress">قيد المعالجة</option><option value="resolved">تم الحل</option><option value="rejected">مرفوض</option></select><button onclick="setStatus(\''+esc(x.id)+'\')">تحديث الحالة</button></div>').join("")||"لا توجد طلبات دعم";$("heroVideo").value=s.settings.hero_video_url||"";}catch(e){$("msg").textContent=e.message}}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
window.removeContent=async id=>{if(!confirm("حذف المحتوى؟"))return;try{await call("/api/admin/content/"+encodeURIComponent(id),{method:"DELETE"});load()}catch(e){$("msg").textContent=e.message}};
window.setStatus=async id=>{try{await call("/api/admin/tickets/"+encodeURIComponent(id),{method:"PATCH",body:JSON.stringify({status:$("st-"+id).value})});$("msg").textContent="تم تحديث حالة الطلب";}catch(e){$("msg").textContent=e.message}};
$("contentForm").onsubmit=async e=>{e.preventDefault();try{await call("/api/admin/content",{method:"POST",body:JSON.stringify({kind:$("kind").value,title:$("title").value,description:$("description").value,image_url:$("image").value,video_url:$("video").value,cta_label:$("cta").value,cta_url:$("href").value,sort_order:Number($("sort").value),is_published:$("published").value==="true"})});e.target.reset();$("msg").textContent="تم حفظ المحتوى";load()}catch(e){$("msg").textContent=e.message}};
$("saveVideo").onclick=async()=>{try{await call("/api/admin/settings",{method:"POST",body:JSON.stringify({hero_video_url:$("heroVideo").value})});$("msg").textContent="تم حفظ رابط المشهد"}catch(e){$("msg").textContent=e.message}};
$("refresh").onclick=load;$("logout").onclick=async()=>{try{await call("/api/admin/logout",{method:"POST"})}catch{}sessionStorage.removeItem("cs_admin_token");token="";$("dashboard").classList.add("hidden");$("login").classList.remove("hidden")};if(token)show();
</script></body></html>
